<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>RakuDoc Editor</title>
        <link rel="stylesheet" href="browser.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.39.1/ace.js" integrity="sha512-tGc7XQXpQYGpFGmdQCEaYhGdJ8B64vyI9c8zdEO4vjYaWRCKYnLy+HkudtawJS3ttk/Pd7xrkRjK8ijcMMyauw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="icon" href="https://irclogs.raku.org/favicon.ico">
        <script src="dynamics.js"></script>
        <script src="web-browser-editor.js"></script>
    </head>
    <body>
        <div id="controls">
            <fieldset>
                <legend>Source for editing</legend>
                <div class="control">
                    <button id="select_Sample">Samples & Tutorials</button>
                    <select id="sampleSelection" class="hidden">
                    <!-- filled dynamically -->
                    </select>
                </div>
                <div class="control">
                    <button id="uploadFile">Upload</button>
                    <input type="file" id="filePicker" accept=".rakudoc" class="hidden"/>
                </div>
                <input type="text" id="sourceFileInput" value="No file selected" disabled/>
            </fieldset>
            <fieldset>
                <legend>Download</legend>
                <div class="control">
                    <button id="downloadBtn">Save</button>
                    <form id="downloadForm" class="hidden">
                        <input type="text" id="downloadName" />
                        <div>
                            <label for="saveFormat">file type</label>
                            <select id="saveFormat">
                                <option value=".rakudoc" selected>RakuDoc</option>
                                <option value=".html">HTML</option>
                            </select>
                        </div>
                        <button type="submit" >Save</button>
                    </form>
                </div>
            </fieldset>
            <fieldset>
                <legend>Render</legend>
                <div id="renderOptions">
                    <label for="autoRender">Auto</label><input type="radio" id="autoRender" checked name="renderType"/>
                    <label for="manualRender">Manual</label><input type="radio" id="manualRender" name="renderType"/>
                    <label for="forceRender">Force rendering</label><button id="forceRender" class="hidden"></button>
                </div>
            </fieldset>
            <fieldset>
                <legend>Framework</legend>
                <div id="frameworkOptions">
                    <label for="Minimal">Minimal</label><input type="radio" id="Minimal" checked name="frameType"/>
                    <label for="Bulma">Bulma & plugins</label><input type="radio" id="onlineFramework" name="frameType"/>
                </div>
            </fieldset>
            <fieldset class="states">
                <legend>State</legend>
                <div id="processing" class="hidden" title="Rendering in process">&nbsp;</div>
                <div id="failed" class="hidden" title="Rendering complete with source error">&nbsp;</div>
                <div id="success" class="hidden" title="Rendering complete">&nbsp;</div>
                <div id="changes" title="Source changes not rendered">&nbsp;</div>
            </fieldset>
            <fieldset id="about">
                <legend>About</legend>
                <div class="control">
                    <button id="aboutInfo">Info</button>
                    <div id="about_info" class="hidden">
                        <details name="about-bits">
                            <summary>Credits</summary><p id="credits"></p>
                        </details>
                        <details name="about-bits">
                            <summary>Based on</summary><p id="based-on"></p>
                        </details>
                        <details name="about-bits">
                            <summary>Source</summary><p id="source"></p>
                        </details>
                        <details name="about-bits">
                            <summary>Made on</summary><p id="made-on"></p>
                        </details>
                    </div>
                </div>
            </fieldset>
        </div>
        <div id="content">
            <div id="editor-panel">
                <div id="editor"></div>
            </div>
            <div id="preview-panel">
                <iframe id="renderFrame"></iframe>
            </div>
    </body>
</html>
